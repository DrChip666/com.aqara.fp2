<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
  <style>
    #log {
      width: 100%;
      height: 50vh;
      box-sizing: border-box;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 11px;
      white-space: pre;
      overflow: auto;
    }
    .actions { display: grid; gap: 8px; margin-top: 12px; }
    .secondary {
      width: 100%;
      padding: 12px;
      border: 1px solid currentColor;
      border-radius: 8px;
      background: transparent;
      color: inherit;
      font: inherit;
    }
    #status { min-height: 1.4em; margin-top: 8px; }
  </style>
</head>
<body>
  <header class="homey-header">
    <h1 class="homey-title" data-i18n="settings.diag.title"></h1>
    <p class="homey-subtitle" data-i18n="settings.diag.intro"></p>
  </header>

  <textarea id="log" readonly></textarea>
  <p id="status"></p>

  <div class="actions">
    <button id="email" class="homey-button-primary-full" data-i18n="settings.diag.email"></button>
    <button id="copy" class="secondary" data-i18n="settings.diag.copy"></button>
    <button id="clear" class="secondary" data-i18n="settings.diag.clear"></button>
  </div>

  <script type="text/javascript">
    // Recipient for "Send by e-mail".
    var SUPPORT_EMAIL = 'morten@bech.eu';
    // Mail apps cut long mailto links, so the body holds only the newest lines.
    // The full log is copied to the clipboard first, so the user can paste it.
    var MAIL_BODY_MAX_CHARS = 1500;

    function onHomeyReady(Homey) {
      var logEl = document.getElementById('log');
      var statusEl = document.getElementById('status');
      var lines = [];

      function render(value) {
        lines = Array.isArray(value) ? value : [];
        logEl.value = lines.length ? lines.join('\n') : Homey.__('settings.diag.empty');
        logEl.scrollTop = logEl.scrollHeight;
      }

      function showStatus(key) {
        statusEl.textContent = Homey.__(key);
      }

      function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text).catch(function () {
            return fallbackCopy(text);
          });
        }
        return fallbackCopy(text);
      }

      function fallbackCopy(text) {
        var helper = document.createElement('textarea');
        helper.value = text;
        document.body.appendChild(helper);
        helper.select();
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        document.body.removeChild(helper);
        return ok ? Promise.resolve() : Promise.reject(new Error('copy failed'));
      }

      Homey.get('diagLog', function (err, value) {
        if (err) return Homey.alert(err);
        render(value);
        Homey.ready();
      });

      // Live update while the page is open.
      Homey.on('settings.set', function (key) {
        if (key !== 'diagLog') return;
        Homey.get('diagLog', function (err, value) {
          if (!err) render(value);
        });
      });

      document.getElementById('copy').addEventListener('click', function () {
        copyText(lines.join('\n'))
          .then(function () { showStatus('settings.diag.copied'); })
          .catch(function () {
            logEl.focus();
            logEl.select();
            showStatus('settings.diag.copyManual');
          });
      });

      document.getElementById('email').addEventListener('click', function () {
        var full = lines.join('\n');
        var tail = full.length > MAIL_BODY_MAX_CHARS
          ? '...\n' + full.slice(full.length - MAIL_BODY_MAX_CHARS)
          : full;
        var body = Homey.__('settings.diag.mailIntro') + '\n\n' + tail;
        var subject = 'Aqara FP2 - Solo diagnostics log';

        function openMail() {
          Homey.openURL('mailto:' + SUPPORT_EMAIL
            + '?subject=' + encodeURIComponent(subject)
            + '&body=' + encodeURIComponent(body));
        }

        copyText(full)
          .then(function () { showStatus('settings.diag.copiedForMail'); })
          .catch(function () {})
          .then(openMail);
      });

      document.getElementById('clear').addEventListener('click', function () {
        Homey.confirm(Homey.__('settings.diag.confirmClear'), function (err, yes) {
          if (err || !yes) return;
          Homey.set('diagLogClearRequest', Date.now(), function (setErr) {
            if (setErr) return Homey.alert(setErr);
            showStatus('settings.diag.cleared');
          });
        });
      });
    }
  </script>
</body>
</html>
